spring.application.name=cashcard
spring.output.ansi.enabled=ALWAYS
logging.level.com.example.cashcard.CashCardController=DEBUG
logging.level.com.example.cashcard.CashCardApplicationTests=DEBUG
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%-22logger{0}){cyan} %clr(:){faint} %msg%n
server.port=8081
